<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10121b">
  <title>HP Cayra — iPhone AU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="phone" aria-label="iPhone Cayra">
    <section id="lockscreen" class="lockscreen">
      <div class="status">
        <span id="lock-time">14:02</span>
        <span>▮▮▮ Wi-Fi ▰</span>
      </div>
      <div class="lock-date" id="lock-date">Jumat, 23 Oktober</div>
      <div class="lock-clock" id="lock-clock">14:02</div>
      <div class="lock-widgets">
        <div class="widget">
          <small>FRIDAY</small>
          <b id="widget-day">23</b>
          <small>OCTOBER</small>
        </div>
        <div class="widget weather">
          <b>☀ 28°</b>
          <small>Jakarta · Cerah</small>
        </div>
      </div>
      <div class="lock-bottom">
        <button class="round-btn" id="flash-btn" aria-label="Senter">⌁</button>
        <button class="unlock-hint" id="unlock-open">Ketuk untuk membuka</button>
        <button class="round-btn" id="camera-shortcut" aria-label="Kamera">◎</button>
      </div>
    </section>

    <section id="dial-screen" class="dial-screen hidden">
      <button class="dial-back" id="dial-cancel">‹</button>
      <div class="dial-title">Masukkan Kode Sandi</div>
      <div class="dots" id="pass-dots">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="dial-error" id="pass-error"></div>
      <div class="dial-pad" id="dial-pad">
        <button data-digit="1">1<small></small></button>
        <button data-digit="2">2<small>ABC</small></button>
        <button data-digit="3">3<small>DEF</small></button>
        <button data-digit="4">4<small>GHI</small></button>
        <button data-digit="5">5<small>JKL</small></button>
        <button data-digit="6">6<small>MNO</small></button>
        <button data-digit="7">7<small>PQRS</small></button>
        <button data-digit="8">8<small>TUV</small></button>
        <button data-digit="9">9<small>WXYZ</small></button>
        <span></span>
        <button data-digit="0">0<small>+</small></button>
        <button id="dial-delete">⌫</button>
      </div>
      <button class="emergency" id="emergency-btn">Darurat</button>
    </section>

    <section id="homescreen" class="homescreen hidden">
      <div class="status home-status">
        <span id="home-time">14:02</span>
        <span>▮▮▮ Wi-Fi ▰</span>
      </div>
      <div class="home-date" id="home-date">Jumat, 23 Oktober</div>
      <div class="home-greeting">cayra's little universe <span>✦</span></div>

      <div class="app-grid">
        <button class="app-icon" data-open="whatsapp">
          <i class="ico whatsapp">☎</i><span>WhatsApp</span>
        </button>
        <button class="app-icon" data-open="instagram">
          <i class="ico instagram">◎</i><span>Instagram</span>
        </button>
        <button class="app-icon" data-open="xapp">
          <i class="ico xapp">𝕏</i><span>X</span>
        </button>
        <button class="app-icon" data-open="spotify">
          <i class="ico spotify">≋</i><span>Spotify</span>
        </button>
        <button class="app-icon" data-open="notes">
          <i class="ico notes">▤</i><span>Notes</span>
        </button>
        <button class="app-icon" data-open="photos">
          <i class="ico photos">✿</i><span>Photos</span>
        </button>
        <button class="app-icon" data-open="camera">
          <i class="ico camera">◉</i><span>Camera</span>
        </button>
        <button class="app-icon" data-open="settings">
          <i class="ico settings">⚙</i><span>Settings</span>
        </button>
      </div>

      <div class="dock">
        <button class="app-icon" data-open="phoneapp">
          <i class="ico phone">⌕</i><span>Phone</span>
        </button>
        <button class="app-icon" data-open="whatsapp">
          <i class="ico whatsapp">☎</i><span>WhatsApp</span>
        </button>
        <button class="app-icon" data-open="instagram">
          <i class="ico instagram">◎</i><span>Instagram</span>
        </button>
        <button class="app-icon" data-open="music">
          <i class="ico music">♫</i><span>Music</span>
        </button>
      </div>
    </section>

    <section id="app-screen" class="app-screen hidden">
      <header class="app-header">
        <button class="header-back" id="app-back">‹</button>
        <div>
          <b id="app-title">WhatsApp</b>
          <small id="app-subtitle">Cayra</small>
        </div>
        <button class="header-more" id="app-more">•••</button>
      </header>
      <div id="app-content" class="app-content"></div>
    </section>

    <div class="home-indicator" id="home-indicator"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
